<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Inter, system-ui, sans-serif" role="img" aria-label="MCP wiring: two agents act as clients connecting to the same two MCP servers, each server wrapping a real tool. Build the server once, every agent uses it.">
  <rect width="760" height="380" fill="#f7f9fb"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">Clients, servers, tools</text>
  <text x="40" y="70" font-size="14" fill="#565e74">Build the server once. Every agent that speaks MCP can use it.</text>

  <text x="100" y="112" font-size="12" font-weight="700" fill="#565e74" text-anchor="middle">CLIENTS</text>
  <text x="380" y="112" font-size="12" font-weight="700" fill="#565e74" text-anchor="middle">MCP SERVERS</text>
  <text x="650" y="112" font-size="12" font-weight="700" fill="#565e74" text-anchor="middle">REAL SYSTEMS</text>

  <!-- clients -->
  <rect x="40" y="140" width="120" height="64" rx="12" fill="#003996"/>
  <text x="100" y="168" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Billing agent</text>
  <text x="100" y="188" font-size="11" fill="#cbd5e1" text-anchor="middle">Claude Code</text>

  <rect x="40" y="240" width="120" height="64" rx="12" fill="#003996"/>
  <text x="100" y="268" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Support agent</text>
  <text x="100" y="288" font-size="11" fill="#cbd5e1" text-anchor="middle">OpenAI SDK</text>

  <!-- servers -->
  <rect x="300" y="140" width="160" height="64" rx="12" fill="#dbe8ff" stroke="#004ac6" stroke-width="1.5"/>
  <text x="380" y="168" font-size="15" font-weight="700" fill="#003996" text-anchor="middle">salesforce</text>
  <text x="380" y="188" font-size="11" fill="#334155" text-anchor="middle">tools · resources</text>

  <rect x="300" y="240" width="160" height="64" rx="12" fill="#dbe8ff" stroke="#004ac6" stroke-width="1.5"/>
  <text x="380" y="268" font-size="15" font-weight="700" fill="#003996" text-anchor="middle">slack</text>
  <text x="380" y="288" font-size="11" fill="#334155" text-anchor="middle">tools · prompts</text>

  <!-- real systems -->
  <rect x="570" y="140" width="150" height="64" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="645" y="178" font-size="13" fill="#334155" text-anchor="middle">Salesforce API</text>

  <rect x="570" y="240" width="150" height="64" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="645" y="278" font-size="13" fill="#334155" text-anchor="middle">Slack API</text>

  <!-- client -> server arrows -->
  <line x1="160" y1="172" x2="288" y2="172" stroke="#004ac6" stroke-width="2"/>
  <polygon points="288,166 300,172 288,178" fill="#004ac6"/>
  <path d="M160 190 L230 190 L230 262 L288 262" fill="none" stroke="#004ac6" stroke-width="2"/>
  <polygon points="288,256 300,262 288,268" fill="#004ac6"/>

  <line x1="160" y1="272" x2="288" y2="272" stroke="#004ac6" stroke-width="2"/>
  <polygon points="288,266 300,272 288,278" fill="#004ac6"/>
  <path d="M160 254 L210 254 L210 182 L288 182" fill="none" stroke="#004ac6" stroke-width="2"/>
  <polygon points="288,176 300,182 288,188" fill="#004ac6"/>

  <!-- server -> system arrows -->
  <line x1="460" y1="172" x2="558" y2="172" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="558,166 570,172 558,178" fill="#94a3b8"/>
  <line x1="460" y1="272" x2="558" y2="272" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="558,266 570,272 558,278" fill="#94a3b8"/>

  <text x="230" y="336" font-size="12" fill="#565e74" text-anchor="middle">JSON-RPC</text>
  <text x="515" y="336" font-size="12" fill="#565e74" text-anchor="middle">your credentials, your code</text>
</svg>
