<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Inter, system-ui, sans-serif" role="img" aria-label="The four layers of AI: Application, Harness, Agent, Model, stacked top to bottom.">
  <rect width="760" height="460" fill="#f7f9fb"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#0f172a">The AI map — four layers</text>
  <text x="40" y="72" font-size="14" fill="#565e74">What people actually mean when they argue about "AI".</text>

  <!-- Application -->
  <rect x="40" y="96" width="680" height="76" rx="12" fill="#dbe8ff" stroke="#004ac6" stroke-width="1.5"/>
  <text x="64" y="128" font-size="17" font-weight="700" fill="#003996">1 · Application</text>
  <text x="64" y="152" font-size="13" fill="#334155">What the user sees — a chatbot, a search box, an app that does things for you.</text>

  <!-- Harness -->
  <rect x="40" y="184" width="680" height="76" rx="12" fill="#e8f0ff" stroke="#004ac6" stroke-width="1.5"/>
  <text x="64" y="216" font-size="17" font-weight="700" fill="#003996">2 · Harness</text>
  <text x="64" y="240" font-size="13" fill="#334155">Memory + tools + skills wrapped around a model. Claude Code, Cursor, ChatGPT.</text>

  <!-- Agent -->
  <rect x="40" y="272" width="680" height="76" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="64" y="304" font-size="17" font-weight="700" fill="#0f172a">3 · Agent</text>
  <text x="64" y="328" font-size="13" fill="#334155">The loop — gather, act, check — with memory and a stop condition.</text>

  <!-- Model -->
  <rect x="40" y="360" width="680" height="76" rx="12" fill="#0f172a"/>
  <text x="64" y="392" font-size="17" font-weight="700" fill="#ffffff">4 · Model</text>
  <text x="64" y="416" font-size="13" fill="#cbd5e1">The LLM itself — Claude, GPT, Gemini. Raw capability, nothing wrapped around it.</text>

  <!-- side labels: centred on their box so the rotated text can't run off the canvas -->
  <text x="736" y="134" font-size="11" fill="#565e74" text-anchor="middle" transform="rotate(90 736 134)">what you buy</text>
  <text x="736" y="398" font-size="11" fill="#565e74" text-anchor="middle" transform="rotate(90 736 398)">what it runs on</text>
</svg>
