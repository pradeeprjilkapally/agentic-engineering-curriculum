<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Inter, system-ui, sans-serif" role="img" aria-label="The agent loop: gather context, act, check, repeating until the goal is met or the agent asks you.">
  <rect width="760" height="380" fill="#f7f9fb"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">The agent loop</text>
  <text x="40" y="70" font-size="14" fill="#565e74">One goal in. Then it circles until done — or until it gets stuck and asks you.</text>

  <!-- Goal -->
  <rect x="40" y="150" width="120" height="72" rx="12" fill="#003996"/>
  <text x="100" y="182" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Your goal</text>
  <text x="100" y="202" font-size="11" fill="#cbd5e1" text-anchor="middle">one sentence</text>

  <!-- arrow to gather -->
  <line x1="160" y1="186" x2="228" y2="186" stroke="#004ac6" stroke-width="2"/>
  <polygon points="228,180 240,186 228,192" fill="#004ac6"/>

  <!-- Gather -->
  <rect x="240" y="150" width="130" height="72" rx="12" fill="#dbe8ff" stroke="#004ac6" stroke-width="1.5"/>
  <text x="305" y="182" font-size="15" font-weight="700" fill="#003996" text-anchor="middle">Gather</text>
  <text x="305" y="202" font-size="11" fill="#334155" text-anchor="middle">read the files</text>

  <!-- Act -->
  <rect x="410" y="150" width="130" height="72" rx="12" fill="#dbe8ff" stroke="#004ac6" stroke-width="1.5"/>
  <text x="475" y="182" font-size="15" font-weight="700" fill="#003996" text-anchor="middle">Act</text>
  <text x="475" y="202" font-size="11" fill="#334155" text-anchor="middle">edit / run</text>

  <!-- Check -->
  <rect x="580" y="150" width="130" height="72" rx="12" fill="#dbe8ff" stroke="#004ac6" stroke-width="1.5"/>
  <text x="645" y="182" font-size="15" font-weight="700" fill="#003996" text-anchor="middle">Check</text>
  <text x="645" y="202" font-size="11" fill="#334155" text-anchor="middle">test / read error</text>

  <!-- arrows between the three -->
  <line x1="370" y1="186" x2="398" y2="186" stroke="#004ac6" stroke-width="2"/>
  <polygon points="398,180 410,186 398,192" fill="#004ac6"/>
  <line x1="540" y1="186" x2="568" y2="186" stroke="#004ac6" stroke-width="2"/>
  <polygon points="568,180 580,186 568,192" fill="#004ac6"/>

  <!-- loop back arrow: check -> gather -->
  <path d="M645 222 L645 280 L305 280 L305 224" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="299,236 305,224 311,236" fill="#94a3b8"/>
  <text x="475" y="300" font-size="12" fill="#565e74" text-anchor="middle">not done yet → loop again</text>

  <!-- done arrow (headed, like the others, and kept clear of the canvas edge) -->
  <line x1="710" y1="186" x2="726" y2="186" stroke="#0f7a45" stroke-width="2"/>
  <polygon points="726,180 738,186 726,192" fill="#0f7a45"/>
  <text x="722" y="140" font-size="12" font-weight="700" fill="#0f7a45" text-anchor="middle">done ✓</text>
</svg>
