<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 622" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="14.5" role="img" aria-label="A first agent session in the terminal: the agent gathers, acts, and checks, then the real git diff and program output are shown.">
  <rect width="900" height="622" rx="14" fill="#0b1020"/>
  <rect width="900" height="40" rx="14" fill="#161d33"/>
  <rect y="26" width="900" height="14" fill="#161d33"/>
  <circle cx="24" cy="20" r="6.5" fill="#ff5f57"/>
  <circle cx="46" cy="20" r="6.5" fill="#febc2e"/>
  <circle cx="68" cy="20" r="6.5" fill="#28c840"/>
  <text x="450.0" y="25" fill="#94a3b8" font-size="13" text-anchor="middle">todo-cli — claude — 80×24</text>
  <text x="20" y="68" xml:space="preserve" fill="#9ae6b4">agentics@mac ~/todo-cli $ claude</text>
<text x="20" y="90" xml:space="preserve" fill="#e2e8f0">&#160;</text>
<text x="20" y="112" xml:space="preserve" fill="#93c5fd">&gt; Find one tiny improvement here, done in under 10 min.</text>
<text x="20" y="134" xml:space="preserve" fill="#93c5fd">&#160;&#160;Tell me the file first, then show the diff and how you checked it.</text>
<text x="20" y="156" xml:space="preserve" fill="#e2e8f0">&#160;</text>
<text x="20" y="178" xml:space="preserve" fill="#c4b5fd">● Gather  read app.py, README.md</text>
<text x="20" y="200" xml:space="preserve" fill="#c4b5fd">● Act     add an INFO log line to greet() so calls are traceable</text>
<text x="20" y="222" xml:space="preserve" fill="#c4b5fd">● Check   ran the file + git diff</text>
<text x="20" y="244" xml:space="preserve" fill="#e2e8f0">&#160;</text>
<text x="20" y="266" xml:space="preserve" fill="#e2e8f0">agentics@mac ~/todo-cli $ git status --short</text>
<text x="20" y="288" xml:space="preserve" fill="#fbbf24">&#160;M app.py</text>
<text x="20" y="310" xml:space="preserve" fill="#e2e8f0">&#160;</text>
<text x="20" y="332" xml:space="preserve" fill="#e2e8f0">agentics@mac ~/todo-cli $ git diff</text>
<text x="20" y="354" xml:space="preserve" fill="#94a3b8">diff --git a/app.py b/app.py</text>
<text x="20" y="376" xml:space="preserve" fill="#38bdf8">@@ -1,4 +1,8 @@</text>
<text x="20" y="398" xml:space="preserve" fill="#86efac">+import logging</text>
<text x="20" y="420" xml:space="preserve" fill="#86efac">+logging.basicConfig(level=logging.INFO)</text>
<text x="20" y="442" xml:space="preserve" fill="#86efac">+</text>
<text x="20" y="464" xml:space="preserve" fill="#e2e8f0">&#160;def greet(name):</text>
<text x="20" y="486" xml:space="preserve" fill="#86efac">+    logging.info(&quot;greeting %s&quot;, name)</text>
<text x="20" y="508" xml:space="preserve" fill="#e2e8f0">&#160;&#160;&#160;&#160;&#160;print(&quot;Hello &quot; + name)</text>
<text x="20" y="530" xml:space="preserve" fill="#e2e8f0">&#160;</text>
<text x="20" y="552" xml:space="preserve" fill="#e2e8f0">agentics@mac ~/todo-cli $ python3 app.py</text>
<text x="20" y="574" xml:space="preserve" fill="#94a3b8">INFO:root:greeting world</text>
<text x="20" y="596" xml:space="preserve" fill="#e2e8f0">Hello world</text>
</svg>