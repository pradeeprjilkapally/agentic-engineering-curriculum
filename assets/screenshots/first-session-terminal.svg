<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 688" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="14.5" role="img" aria-label="A real first agent session in the terminal: the agent gathers context, runs the program, edits app.py, and re-checks; then git status, the real git diff, and the program output confirm the change.">
  <rect width="900" height="688" rx="14" fill="#0b1020"/>
  <rect width="900" height="40" rx="14" fill="#161d33"/>
  <rect y="26" width="900" height="14" fill="#161d33"/>
  <circle cx="24" cy="20" r="6.5" fill="#ff5f57"/>
  <circle cx="46" cy="20" r="6.5" fill="#febc2e"/>
  <circle cx="68" cy="20" r="6.5" fill="#28c840"/>
  <text x="450.0" y="25" fill="#94a3b8" font-size="13" text-anchor="middle">todo-cli — claude — 80×24</text>
  <text x="20" y="68" xml:space="preserve" fill="#9ae6b4">agentics@mac&#160;~/todo-cli&#160;$&#160;claude</text>
  <text x="20" y="90" xml:space="preserve" fill="#e2e8f0">&#160;</text>
  <text x="20" y="112" xml:space="preserve" fill="#93c5fd">&gt;&#160;Find&#160;one&#160;tiny&#160;improvement&#160;here,&#160;done&#160;in&#160;under&#160;10&#160;min.</text>
  <text x="20" y="134" xml:space="preserve" fill="#93c5fd">&#160;&#160;Tell&#160;me&#160;the&#160;file&#160;first,&#160;then&#160;show&#160;the&#160;diff&#160;and&#160;how&#160;you&#160;checked&#160;it.</text>
  <text x="20" y="156" xml:space="preserve" fill="#e2e8f0">&#160;</text>
  <text x="20" y="178" xml:space="preserve" fill="#c4b5fd">●&#160;Gather&#160;&#160;cat&#160;-n&#160;app.py&#160;&amp;&amp;&#160;cat&#160;README.md</text>
  <text x="20" y="200" xml:space="preserve" fill="#c4b5fd">●&#160;Check&#160;&#160;&#160;python3&#160;app.py&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;←&#160;ran&#160;it&#160;before&#160;changing&#160;anything</text>
  <text x="20" y="222" xml:space="preserve" fill="#c4b5fd">●&#160;Act&#160;&#160;&#160;&#160;&#160;Edit&#160;app.py</text>
  <text x="20" y="244" xml:space="preserve" fill="#c4b5fd">●&#160;Check&#160;&#160;&#160;python3&#160;app.py;&#160;python3&#160;-c&#160;&quot;import&#160;app&quot;</text>
  <text x="20" y="266" xml:space="preserve" fill="#e2e8f0">&#160;</text>
  <text x="20" y="288" xml:space="preserve" fill="#e2e8f0">&#160;&#160;app.py&#160;—&#160;greet(&quot;world&quot;)&#160;fires&#160;on&#160;import,&#160;not&#160;just&#160;on&#160;run.</text>
  <text x="20" y="310" xml:space="preserve" fill="#e2e8f0">&#160;&#160;Guarded&#160;it&#160;behind&#160;__main__.&#160;Checked&#160;both&#160;paths.</text>
  <text x="20" y="332" xml:space="preserve" fill="#e2e8f0">&#160;</text>
  <text x="20" y="354" xml:space="preserve" fill="#9ae6b4">agentics@mac&#160;~/todo-cli&#160;$&#160;git&#160;status&#160;--short</text>
  <text x="20" y="376" xml:space="preserve" fill="#fbbf24">&#160;M&#160;app.py</text>
  <text x="20" y="398" xml:space="preserve" fill="#e2e8f0">&#160;</text>
  <text x="20" y="420" xml:space="preserve" fill="#9ae6b4">agentics@mac&#160;~/todo-cli&#160;$&#160;git&#160;diff</text>
  <text x="20" y="442" xml:space="preserve" fill="#94a3b8">diff&#160;--git&#160;a/app.py&#160;b/app.py</text>
  <text x="20" y="464" xml:space="preserve" fill="#38bdf8">@@&#160;-1,4&#160;+1,5&#160;@@</text>
  <text x="20" y="486" xml:space="preserve" fill="#e2e8f0">&#160;def&#160;greet(name):</text>
  <text x="20" y="508" xml:space="preserve" fill="#e2e8f0">&#160;&#160;&#160;&#160;&#160;print(&quot;Hello&#160;&quot;&#160;+&#160;name)</text>
  <text x="20" y="530" xml:space="preserve" fill="#e2e8f0">&#160;</text>
  <text x="20" y="552" xml:space="preserve" fill="#fca5a5">-greet(&quot;world&quot;)</text>
  <text x="20" y="574" xml:space="preserve" fill="#86efac">+if&#160;__name__&#160;==&#160;&quot;__main__&quot;:</text>
  <text x="20" y="596" xml:space="preserve" fill="#86efac">+&#160;&#160;&#160;&#160;greet(&quot;world&quot;)</text>
  <text x="20" y="618" xml:space="preserve" fill="#e2e8f0">&#160;</text>
  <text x="20" y="640" xml:space="preserve" fill="#9ae6b4">agentics@mac&#160;~/todo-cli&#160;$&#160;python3&#160;app.py</text>
  <text x="20" y="662" xml:space="preserve" fill="#94a3b8">Hello&#160;world</text>
</svg>
